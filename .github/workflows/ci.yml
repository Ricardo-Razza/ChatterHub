name: CI do Razzacord

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  api:
    name: API · Testes e pacote Maven
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 'Razzacord - API'
    env:
      SPRING_PROFILES_ACTIVE: dev
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          cache-dependency-path: 'Razzacord - API/pom.xml'
      - name: Testar e empacotar a API
        run: mvn --batch-mode --no-transfer-progress verify

  frontend:
    name: Frontend · Build Angular
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: 'Razzacord - Front'
    env:
      NG_CLI_ANALYTICS: 'false'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 'Razzacord - Front/package-lock.json'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Compilar para produção
        run: npm run build -- --configuration production

  desktop:
    name: Desktop · Empacotamento Windows
    runs-on: windows-2022
    timeout-minutes: 20
    defaults:
      run:
        working-directory: 'Razzacord - Desktop'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 'Razzacord - Desktop/package-lock.json'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Empacotar aplicação
        run: npm run dist -- --win nsis portable --x64
      - name: Guardar artefatos do desktop
        uses: actions/upload-artifact@v4
        with:
          name: razzacord-desktop-windows
          path: 'Razzacord - Desktop/dist/*.exe'
          if-no-files-found: error

  release:
    name: Desktop · Publicar release
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [desktop]
    runs-on: windows-2022
    timeout-minutes: 20
    permissions:
      contents: write
    defaults:
      run:
        working-directory: 'Razzacord - Desktop'
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: 'Razzacord - Desktop/package-lock.json'
      - name: Instalar dependências
        run: npm ci --no-audit --no-fund
      - name: Publicar instaladores no GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run dist -- --win nsis portable --x64 --publish always
