# Perfil de produção: MySQL via variáveis de ambiente. JWT_SECRET e DB_PASSWORD são obrigatórios.
spring.datasource.url=jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:chatterhubdb}?serverTimezone=UTC&useUnicode=true&characterEncoding=UTF-8&allowPublicKeyRetrieval=true&useSSL=${DB_USE_SSL:false}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.username=${DB_USER:chatterhub}
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
