spring.application.name=ChatterHub
server.port=${PORT:8080}
spring.profiles.default=dev
server.forward-headers-strategy=native
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# Segredo do JWT (>= 32 caracteres). Obrigatório; no perfil dev há um valor de desenvolvimento.
jwt.secret=${JWT_SECRET:}
jwt.expiration=${JWT_EXPIRATION_MS:86400000}

# Origens permitidas para CORS e WebSocket (separadas por vírgula)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200,http://127.0.0.1:4200,http://localhost:3001}

# WebRTC: STUN/TURN. O TURN usa credenciais temporárias (coturn com use-auth-secret).
app.stun.urls=${STUN_URLS:stun:stun.l.google.com:19302}
app.turn.urls=${TURN_URLS:}
app.turn.secret=${TURN_SECRET:}
app.turn.ttl-seconds=${TURN_TTL_SECONDS:86400}

# SFU (LiveKit). Vazio = malha P2P. A chave/segredo precisam ser os mesmos do servidor LiveKit.
app.livekit.url=${LIVEKIT_URL:}
app.livekit.api-key=${LIVEKIT_API_KEY:}
app.livekit.api-secret=${LIVEKIT_API_SECRET:}
