<div class="flex h-full min-w-0 flex-col">

  <!-- Header do canal -->
  <header class="flex h-14 shrink-0 items-center gap-2 border-b border-ch-border px-4 shadow-sm">
    <lucide-icon name="hash" [size]="20" class="text-ch-text-muted"></lucide-icon>
    <h1 class="font-semibold text-ch-text-primary">{{ channelService.activeChannel()?.name }}</h1>
    <div class="mx-2 h-6 w-px bg-ch-border"></div>
    <p class="hidden truncate text-sm text-ch-text-muted sm:block">
      Bem-vindo(a) ao canal! Fiquem à vontade para conversar.
    </p>

    <div class="ml-auto flex items-center gap-4 text-ch-text-muted">
      <button type="button" class="hover:text-ch-text-primary transition-colors" aria-label="Fixados">
        <lucide-icon name="pin" [size]="20"></lucide-icon>
      </button>
      <button type="button" class="hover:text-ch-text-primary transition-colors" aria-label="Membros">
        <lucide-icon name="users" [size]="20"></lucide-icon>
      </button>
      <div class="relative hidden md:block">
        <lucide-icon
          name="search"
          [size]="15"
          class="pointer-events-none absolute left-2 top-1/2 -translate-y-1/2 text-ch-text-muted"
        ></lucide-icon>
        <input
          type="text"
          placeholder="Pesquisar"
          class="w-36 rounded-lg bg-ch-bg-dark py-1.5 pl-7 pr-2 text-sm outline-none placeholder:text-ch-text-muted focus:ring-2 focus:ring-ch-brand/50 transition-all"
        />
      </div>
    </div>
  </header>

  <!-- Mensagens -->
  <div class="flex-1 overflow-y-auto pb-4">
    <div class="flex flex-col pt-4">
      <app-message
        *ngFor="let message of chatService.messagesForActiveChannel()"
        [avatarUrl]="message.authorAvatarUrl"
        [authorName]="message.authorName"
        [createdAt]="message.createdAt"
        [content]="message.content"
        [grouped]="!!message.grouped"
      />
    </div>
    <div #scrollAnchor></div>
  </div>

  <!-- Campo de digitação -->
  <app-chat-input
    [channelName]="channelService.activeChannel()?.name ?? ''"
    (send)="onSend($event)"
  />
</div>
