<div *ngIf="visible()" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm"
     (click)="onBackdropClick($event)">
  <div class="w-full max-w-sm rounded-xl bg-ch-bg-dark p-6 shadow-2xl border border-ch-border" (click)="$event.stopPropagation()">
    <h2 class="mb-1 text-xl font-bold text-ch-text-primary">Criar Canal</h2>
    <p class="mb-5 text-sm text-ch-text-muted">Adicione um canal ao servidor.</p>

    <form (ngSubmit)="submit()">
      <!-- Tipo -->
      <div class="mb-4 flex gap-2">
        <button type="button" (click)="channelType = 'text'"
          class="flex-1 flex items-center justify-center gap-2 rounded-lg py-2.5 text-sm font-semibold border-2 transition-all"
          [ngClass]="channelType === 'text' ? 'border-ch-brand bg-ch-brand/20 text-ch-text-primary' : 'border-ch-border text-ch-text-muted hover:text-ch-text-primary'">
          <lucide-icon name="hash" [size]="16"></lucide-icon> Texto
        </button>
        <button type="button" (click)="channelType = 'voice'"
          class="flex-1 flex items-center justify-center gap-2 rounded-lg py-2.5 text-sm font-semibold border-2 transition-all"
          [ngClass]="channelType === 'voice' ? 'border-ch-brand bg-ch-brand/20 text-ch-text-primary' : 'border-ch-border text-ch-text-muted hover:text-ch-text-primary'">
          <lucide-icon name="volume-2" [size]="16"></lucide-icon> Voz
        </button>
      </div>

      <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-ch-text-muted">Nome do Canal</label>
      <input type="text" [(ngModel)]="name" name="channelName" required maxlength="40"
        [placeholder]="channelType === 'text' ? 'ex: geral' : 'ex: Sala Geral'"
        class="mb-4 w-full rounded-md bg-ch-bg-darker px-3 py-2.5 text-sm text-ch-text-primary placeholder:text-ch-text-muted outline-none ring-1 ring-ch-border focus:ring-ch-brand transition-all" />

      <div class="flex gap-2 justify-end">
        <button type="button" (click)="close()"
          class="rounded-md px-4 py-2 text-sm font-semibold text-ch-text-muted hover:text-ch-text-primary transition-colors">
          Cancelar
        </button>
        <button type="submit" [disabled]="!name.trim()"
          class="rounded-md bg-ch-brand px-5 py-2 text-sm font-semibold text-white hover:brightness-110 disabled:opacity-40 transition-all">
          Criar
        </button>
      </div>
    </form>
  </div>
</div>
