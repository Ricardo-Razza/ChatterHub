<div *ngIf="visible()" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm"
     (click)="onBackdropClick($event)">
  <div class="w-full max-w-md rounded-xl bg-ch-bg-dark p-6 shadow-2xl border border-ch-border" (click)="$event.stopPropagation()">
    <h2 class="mb-1 text-xl font-bold text-ch-text-primary">Convidar amigos para {{ serverName() }}</h2>
    <p class="mb-5 text-sm text-ch-text-muted">Compartilhe o link abaixo para convidar pessoas.</p>

    <label class="mb-1 block text-xs font-semibold uppercase tracking-wide text-ch-text-muted">Link do convite</label>
    <div class="mb-2 flex gap-2">
      <input type="text" readonly [value]="link()" placeholder="Gerando link..."
        class="min-w-0 flex-1 rounded-md bg-ch-bg-darker px-3 py-2.5 text-sm text-ch-text-primary placeholder:text-ch-text-muted outline-none ring-1 ring-ch-border" />
      <button type="button" (click)="copy()" [disabled]="!link() || loading()"
        class="shrink-0 rounded-md bg-ch-brand px-4 py-2 text-sm font-semibold text-white hover:brightness-110 disabled:opacity-40 transition-all">
        {{ copied() ? 'Copiado!' : 'Copiar' }}
      </button>
    </div>

    <p class="mb-4 text-xs text-ch-text-muted">O link expira em 7 dias.</p>

    <p *ngIf="error()" class="mb-4 text-sm text-red-400">{{ error() }}</p>

    <div class="flex justify-end">
      <button type="button" (click)="generate()" [disabled]="loading()"
        class="rounded-md px-4 py-2 text-sm font-semibold text-ch-text-muted hover:text-ch-text-primary disabled:opacity-40 transition-colors">
        Gerar novo link
      </button>
    </div>
  </div>
</div>
