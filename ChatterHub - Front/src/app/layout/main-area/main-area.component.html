<div class="flex h-full w-full min-w-0 flex-col bg-ch-bg-medium">

  <!-- Estado vazio: sem servidor -->
  <ng-container *ngIf="!serverService.activeServerId()">
    <div class="flex flex-1 h-full flex-col items-center justify-center gap-4 text-center px-8">
      <lucide-icon name="message-square" [size]="64" class="text-ch-text-muted opacity-20"></lucide-icon>
      <div>
        <h2 class="text-xl font-bold text-ch-text-primary">Bem-vindo ao ChatterHub!</h2>
        <p class="mt-2 text-sm text-ch-text-muted">
          Crie ou selecione um servidor na barra lateral esquerda para começar a conversar.
        </p>
      </div>
    </div>
  </ng-container>

  <!-- Estado vazio: servidor sem canais selecionados -->
  <ng-container *ngIf="serverService.activeServerId() && !channelService.activeChannelId()">
    <div class="flex flex-1 h-full flex-col items-center justify-center gap-4 text-center px-8">
      <lucide-icon name="hash" [size]="64" class="text-ch-text-muted opacity-20"></lucide-icon>
      <div>
        <h2 class="text-xl font-bold text-ch-text-primary">Nenhum canal selecionado</h2>
        <p class="mt-2 text-sm text-ch-text-muted">
          Selecione um canal de texto ou voz na barra lateral para começar.
        </p>
      </div>
    </div>
  </ng-container>

  <!-- Canal de texto -->
  <app-text-chat *ngIf="channelService.activeChannelId() && channelService.mainAreaMode() === 'text'" />

  <!-- Canal de voz -->
  <app-voice-room *ngIf="channelService.activeChannelId() && channelService.mainAreaMode() === 'voice'" />
</div>
