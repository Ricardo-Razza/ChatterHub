<div class="flex h-full w-full gap-3 p-4">

  <!-- LAYOUT COM COMPARTILHAMENTO DE TELA: vídeo em destaque (~80%) + grade lateral -->
  <ng-container *ngIf="featuredUser(); else normalGrid">
    <div class="flex h-full w-full flex-col gap-3 md:flex-row">

      <!-- Tela compartilhada em destaque com stream de vídeo real -->
      <div class="flex h-[65%] w-full md:h-full md:w-[80%]">
        <div class="relative flex h-full w-full items-center justify-center overflow-hidden rounded-xl
                    bg-black ring-2 ring-ch-brand shadow-brand-glow">
          <video
            #screenVideo
            autoplay
            playsinline
            class="h-full w-full object-contain"
          ></video>

          <span class="absolute left-3 top-3 rounded bg-black/60 px-2 py-1 text-xs font-medium text-white flex items-center gap-1.5 backdrop-blur-sm">
            <span class="h-2 w-2 rounded-full bg-ch-danger animate-pulse"></span>
            Ao vivo ({{ featuredUser()?.username }})
          </span>

          <!-- Indicador de carregamento enquanto o stream WebRTC conecta -->
          <div
            *ngIf="!voiceService.activeScreenStream()"
            class="absolute inset-0 flex flex-col items-center justify-center gap-2 bg-black/80 text-ch-text-muted"
          >
            <div class="h-8 w-8 animate-spin rounded-full border-2 border-ch-brand border-t-transparent"></div>
            <span class="text-xs font-medium text-white">Carregando transmissão de {{ featuredUser()?.username }}...</span>
          </div>

          <!-- Controle de Volume da Transmissão / Tela Compartilhada -->
          <div class="absolute bottom-3 right-3 z-10 flex items-center gap-2 rounded-lg bg-black/75 px-3 py-1.5 backdrop-blur-md border border-white/10 shadow-lg text-white">
            <button
              type="button"
              (click)="toggleMuteScreen()"
              class="text-ch-text-muted hover:text-white transition-colors focus:outline-none flex items-center"
              [title]="voiceService.screenShareVolume() === 0 ? 'Desmutar áudio da tela' : 'Mutar áudio da tela'"
            >
              <lucide-icon [name]="voiceService.screenShareVolume() === 0 ? 'volume-x' : 'volume-2'" [size]="16"></lucide-icon>
            </button>
            <input
              type="range"
              min="0"
              max="100"
              [value]="voiceService.screenShareVolume()"
              (input)="onScreenVolumeChange($event)"
              class="w-20 sm:w-28 h-1.5 bg-white/20 rounded-lg appearance-none cursor-pointer accent-ch-brand"
            />
            <span class="text-[11px] font-semibold tabular-nums text-ch-text-primary min-w-[2rem] text-right">
              {{ voiceService.screenShareVolume() }}%
            </span>
          </div>
        </div>
      </div>

      <!-- Grade lateral com os participantes -->
      <div class="grid h-[35%] w-full grid-cols-3 gap-2 overflow-y-auto md:h-full md:w-[20%] md:grid-cols-1">
        <app-user-card *ngFor="let user of otherParticipants()" [user]="user" />
      </div>
    </div>
  </ng-container>

  <!-- LAYOUT NORMAL: grade de participantes -->
  <ng-template #normalGrid>
    <div
      class="grid h-full w-full auto-rows-fr gap-3"
      [ngClass]="{
        'grid-cols-1 max-w-xl mx-auto': voiceService.participants().length === 1,
        'grid-cols-2': voiceService.participants().length === 2,
        'grid-cols-2 md:grid-cols-3': voiceService.participants().length > 2
      }"
    >
      <app-user-card *ngFor="let user of voiceService.participants()" [user]="user" />
    </div>
  </ng-template>
</div>
