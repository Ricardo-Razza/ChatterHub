<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <title>Razzacord - Sem Conexão</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: #1b2d4d;
      color: #f7fafc;
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      user-select: none;
    }
    .card {
      background: rgba(34, 55, 93, 0.96);
      border: 1px solid #3a5c82;
      border-radius: 24px;
      padding: 24px;
      max-width: 460px;
      width: calc(100% - 32px);
      text-align: center;
      box-shadow: 0 24px 80px rgba(44, 79, 91, 0.18);
    }
    .logo-container {
      margin-bottom: 20px;
      display: inline-flex;
      background: #66aaf2;
      border-radius: 18px;
      padding: 6px;
      overflow: hidden;
      box-shadow: 0 0 20px rgba(102, 170, 242, 0.28);
    }
    .logo-container img {
      width: 96px;
      height: 96px;
      display: block;
      border-radius: 14px;
      object-fit: cover;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #f7fafc;
    }
    p {
      font-size: 14px;
      color: #b3c8dc;
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .btn {
      display: inline-block;
      background-color: #66aaf2;
      color: #ffffff;
      border: none;
      padding: 12px 24px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      transition: background-color 0.2s, transform 0.1s;
      width: 100%;
    }
    .btn:hover {
      background-color: #4752c4;
    }
    .btn:active {
      transform: scale(0.98);
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="logo-container">
      <img src="assets/icon.png" alt="Razzacord Logo">
    </div>
    <h1>Sem Conexão com o Servidor</h1>
    <p>Não foi possível conectar ao Razzacord. Verifique sua conexão com a internet ou aguarde alguns instantes se o servidor estiver reiniciando.</p>
    <button class="btn" onclick="retry()">Tentar Novamente</button>
  </div>

  <script>
    function retry() {
      window.location.href = 'https://razzacord.razzadev.io';
    }
  </script>
</body>
</html>
