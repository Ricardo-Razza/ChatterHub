<header *ngIf="isDesktop"
  class="fixed inset-x-0 top-0 z-[100] flex h-10 items-center border-b border-ch-border/70 bg-ch-bg-darker px-3"
  style="-webkit-app-region: drag">
  <div class="flex min-w-0 items-center gap-2">
    <img src="assets/razzacord-avatar-original.jpg" alt="" class="h-5 w-5 rounded-md object-cover" />
    <span class="truncate text-xs font-semibold text-ch-text-primary">Razzacord</span>
  </div>
  <div class="ml-auto grid h-full grid-cols-[44px_44px_44px] items-stretch" style="-webkit-app-region: no-drag">
    <button type="button" (click)="minimizeWindow()"
      class="flex h-full w-[44px] items-center justify-center text-ch-text-muted hover:bg-ch-bg-light hover:text-white" aria-label="Minimizar">
      <span class="mb-[-4px] block h-[1.5px] w-[11px] bg-current"></span>
    </button>
    <button type="button" (click)="maximizeWindow()"
      class="flex h-full w-[44px] items-center justify-center text-ch-text-muted hover:bg-ch-bg-light hover:text-white" aria-label="Maximizar">
      <span class="block h-[10px] w-[10px] border-[1.5px] border-current"></span>
    </button>
    <button type="button" (click)="closeWindow()"
      class="flex h-full w-[44px] items-center justify-center text-ch-text-muted hover:bg-[#d84b4b] hover:text-white" aria-label="Fechar">
      <span class="relative block h-[12px] w-[12px]">
        <span class="absolute left-1/2 top-1/2 h-[1.5px] w-[12px] -translate-x-1/2 -translate-y-1/2 rotate-45 bg-current"></span>
        <span class="absolute left-1/2 top-1/2 h-[1.5px] w-[12px] -translate-x-1/2 -translate-y-1/2 -rotate-45 bg-current"></span>
      </span>
    </button>
  </div>
</header>

<!-- Tela de Login (quando não autenticado) -->
<app-login *ngIf="!authService.isLoggedIn()" [class.pt-9]="isDesktop" />

<!-- App Principal (quando autenticado) -->
<div *ngIf="authService.isLoggedIn()"
     [ngClass]="isDesktop ? 'mt-10 h-[calc(100vh-40px)]' : 'h-screen'"
     class="w-screen overflow-hidden bg-ch-bg-deep text-ch-text-primary antialiased">

  <!-- Painel de DMs (overlay) -->
  <div *ngIf="showDmPanel"
    class="absolute inset-0 z-40 flex"
    (click)="toggleDmPanel()">
    <div class="absolute inset-0 bg-black/40 backdrop-blur-sm"></div>
    <div class="relative z-50 ml-[68px] h-full w-full max-w-4xl shadow-2xl"
      (click)="$event.stopPropagation()">
      <app-dm-panel class="h-full" />
    </div>
  </div>

  <div class="grid h-full grid-cols-[68px_260px_1fr] max-md:grid-cols-[68px_1fr] max-sm:grid-cols-[1fr]">
    <!-- Sidebar de servidores com botão DM -->
    <app-server-sidebar class="h-full max-sm:hidden"
      [dmUnread]="dmUnread()"
      (openDm)="toggleDmPanel()" />
    <app-channel-sidebar class="h-full max-md:hidden" />
    <main class="h-full min-w-0">
      <router-outlet />
    </main>
  </div>
</div>

<!-- Container de toasts globais -->
<app-toast-container />
