<aside class="flex h-full w-[260px] flex-col bg-ch-bg-dark border-r border-ch-border">

  <!-- Cabeçalho com nome do servidor -->
  <div class="flex h-14 shrink-0 items-center justify-between border-b border-ch-border px-4 font-semibold text-ch-text-primary shadow-sm">
    <span class="truncate">{{ serverService.activeServer()?.name ?? "Nenhum servidor" }}</span>
    <button *ngIf="serverService.activeServerId()" type="button" (click)="openInvite()"
      class="ml-2 flex h-7 w-7 shrink-0 items-center justify-center rounded text-ch-text-muted hover:text-ch-text-primary transition-colors"
      title="Convidar pessoas" aria-label="Convidar pessoas">
      <lucide-icon name="user-plus" [size]="18"></lucide-icon>
    </button>
  </div>

  <!-- Estado vazio -->
  <div *ngIf="!serverService.activeServerId()" class="flex flex-1 flex-col items-center justify-center gap-3 px-4 text-center">
    <lucide-icon name="hash" [size]="40" class="text-ch-text-muted opacity-30"></lucide-icon>
    <p class="text-sm text-ch-text-muted">Selecione ou crie um servidor na barra lateral esquerda.</p>
  </div>

  <!-- Lista de canais -->
  <div *ngIf="serverService.activeServerId()" class="flex-1 overflow-y-auto px-2 py-3">

    <!-- Canais de Texto -->
    <div class="mb-2">
      <div class="flex items-center justify-between px-1 py-1.5">
        <button type="button" (click)="toggleText()"
          class="flex flex-1 items-center gap-1 text-xs font-semibold uppercase tracking-wide text-ch-text-muted hover:text-ch-text-primary transition-colors">
          <lucide-icon name="chevron-down" [size]="12" class="transition-transform duration-150"
            [class.-rotate-90]="textCollapsed()"></lucide-icon>
          <span>Canais de Texto</span>
        </button>
        <button type="button" (click)="addTextChannel()"
          class="flex h-5 w-5 items-center justify-center rounded text-ch-text-muted hover:text-ch-accent transition-colors"
          title="Criar canal de texto">
          <lucide-icon name="plus" [size]="14"></lucide-icon>
        </button>
      </div>

      <ul *ngIf="!textCollapsed()" class="mt-0.5 flex flex-col gap-0.5">
        <li *ngFor="let channel of channelService.textChannels()">
          <button type="button" (click)="selectText(channel.id)"
            class="group flex w-full items-center gap-1.5 rounded-lg px-2 py-1.5 text-sm font-medium transition-all duration-200"
            [ngClass]="
              channel.id === channelService.activeChannelId() && channelService.mainAreaMode() === 'text'
                ? 'bg-ch-brand text-white shadow-brand-glow'
                : isUnread(channel.id)
                  ? 'text-ch-text-primary font-bold hover:bg-ch-bg-light'
                  : 'text-ch-text-muted hover:bg-ch-bg-light hover:text-ch-text-primary'
            ">
            <lucide-icon name="hash" [size]="18" class="shrink-0 opacity-70"></lucide-icon>
            <span class="truncate flex-1">{{ channel.name }}</span>
            <!-- Badge de não-lido -->
            <span *ngIf="isUnread(channel.id) && channel.id !== channelService.activeChannelId()"
              class="ml-auto h-2 w-2 rounded-full bg-ch-brand shrink-0"></span>
          </button>
        </li>
        <li *ngIf="channelService.textChannels().length === 0">
          <p class="px-2 py-1 text-xs text-ch-text-muted italic">Nenhum canal de texto</p>
        </li>
      </ul>
    </div>

    <!-- Canais de Voz -->
    <div>
      <div class="flex items-center justify-between px-1 py-1.5">
        <button type="button" (click)="toggleVoice()"
          class="flex flex-1 items-center gap-1 text-xs font-semibold uppercase tracking-wide text-ch-text-muted hover:text-ch-text-primary transition-colors">
          <lucide-icon name="chevron-down" [size]="12" class="transition-transform duration-150"
            [class.-rotate-90]="voiceCollapsed()"></lucide-icon>
          <span>Canais de Voz</span>
        </button>
        <button type="button" (click)="addVoiceChannel()"
          class="flex h-5 w-5 items-center justify-center rounded text-ch-text-muted hover:text-ch-accent transition-colors"
          title="Criar canal de voz">
          <lucide-icon name="plus" [size]="14"></lucide-icon>
        </button>
      </div>

      <ul *ngIf="!voiceCollapsed()" class="mt-0.5 flex flex-col gap-0.5">
        <li *ngFor="let channel of channelService.voiceChannels()">
          <button type="button" (click)="joinVoice(channel.id)"
            class="group flex w-full items-center gap-1.5 rounded-lg px-2 py-1.5 text-sm font-medium transition-all duration-200"
            [ngClass]="
              channel.id === channelService.voiceChannelId() && channelService.mainAreaMode() === 'voice'
                ? 'bg-ch-brand text-white shadow-brand-glow'
                : channel.id === channelService.voiceChannelId()
                  ? 'bg-ch-bg-light text-ch-success'
                : 'text-ch-text-muted hover:bg-ch-bg-light hover:text-ch-text-primary'
            ">
            <lucide-icon name="volume-2" [size]="18" class="shrink-0 opacity-70"></lucide-icon>
            <span class="truncate">{{ channel.name }}</span>
          </button>

          <!-- Quem está em canais de voz onde você não está -->
          <ul *ngIf="channel.id !== channelService.voiceChannelId() && presence.usersIn(channel.id).length > 0"
            class="ml-6 mt-1 flex flex-col gap-1 pb-1">
            <li *ngFor="let u of presence.usersIn(channel.id)"
              class="flex items-center gap-2 rounded px-2 py-1 text-xs text-ch-text-muted">
              <img [src]="u.avatarUrl" [alt]="u.username" class="h-5 w-5 rounded-full object-cover" />
              <span class="truncate font-medium">{{ u.username }}</span>
            </li>
          </ul>

          <!-- Participantes no canal de voz ativo -->
          <ul *ngIf="channel.id === channelService.voiceChannelId()"
            class="ml-6 mt-1 flex flex-col gap-1 pb-1">
            <li *ngFor="let user of voiceService.participants()"
              class="flex items-center gap-2 rounded px-2 py-1 text-xs text-ch-text-primary hover:bg-ch-bg-light">
              <img [src]="user.avatarUrl" [alt]="user.username" class="h-5 w-5 rounded-full object-cover ring-1"
                [ngClass]="user.isSpeaking ? 'ring-ch-success' : 'ring-transparent'" />
              <span class="truncate font-medium">{{ user.username }}</span>
              <div class="ml-auto flex items-center gap-1">
                <lucide-icon *ngIf="user.isSharingScreen" name="screen-share" [size]="12" class="text-ch-brand-light"></lucide-icon>
                <lucide-icon *ngIf="user.isMuted" name="mic-off" [size]="12" class="text-ch-danger"></lucide-icon>
              </div>
            </li>
          </ul>
        </li>
        <li *ngIf="channelService.voiceChannels().length === 0">
          <p class="px-2 py-1 text-xs text-ch-text-muted italic">Nenhum canal de voz</p>
        </li>
      </ul>
    </div>
  </div>

  <!-- Conexão de voz ativa (permanece ao navegar pelos canais de texto) -->
  <div *ngIf="channelService.voiceChannelId()"
    class="flex shrink-0 items-center gap-2 border-t border-ch-border bg-ch-bg-darker px-3 py-2">
    <button type="button" (click)="channelService.showVoiceRoom()" class="min-w-0 flex-1 text-left" title="Abrir sala de voz">
      <p class="flex items-center gap-1.5 text-xs font-semibold"
        [ngClass]="voiceService.connectionPhase() === 'connected' ? 'text-ch-success' : 'text-ch-warning'">
        <span class="h-2 w-2 rounded-full bg-current"
          [class.animate-pulse]="voiceService.connectionPhase() !== 'connected'"></span>
        {{ voiceService.connectionPhase() === 'connected' ? 'Voz conectada'
          : voiceService.connectionPhase() === 'reconnecting' ? 'Reconectando...' : 'Conectando...' }}
      </p>
      <p class="truncate text-xs text-ch-text-muted">{{ channelService.voiceChannelName() }}</p>
    </button>
    <button type="button" (click)="channelService.leaveVoiceChannel()"
      class="flex h-8 w-8 items-center justify-center rounded-lg text-ch-text-muted transition-colors hover:bg-ch-bg-light hover:text-ch-danger"
      title="Desconectar da chamada" aria-label="Desconectar da chamada">
      <lucide-icon name="phone-off" [size]="18"></lucide-icon>
    </button>
  </div>

  <!-- Controles do usuário -->
  <app-user-controls />
</aside>

<!-- Modal criar canal -->
<app-create-channel-modal />
<app-invite-modal />
