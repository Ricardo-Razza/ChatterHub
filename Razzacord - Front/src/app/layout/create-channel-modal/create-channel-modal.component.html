<div *ngIf="visible()" class="fixed inset-0 z-50 flex items-center justify-center bg-black/70 backdrop-blur-sm" (click)="close()">
  <form (ngSubmit)="submit()" (click)="$event.stopPropagation()"
    class="grid w-full max-w-md gap-4 rounded-xl border border-ch-border bg-ch-bg-dark p-6 text-sm text-ch-text-primary shadow-2xl">
    <h2 class="text-xl font-bold">{{ editing ? 'Editar canal' : 'Criar canal' }}</h2>

    <div class="grid gap-1">
      <label for="channel-type">Tipo</label>
      <select id="channel-type" [(ngModel)]="channelType" name="type" class="rounded-md border border-ch-border bg-ch-bg-darker p-2">
        <option *ngIf="editing?.type !== 'voice'" value="text">Texto</option>
        <option *ngIf="!editing || editing.type === 'voice'" value="voice">Voz</option>
        <option *ngIf="editing?.type !== 'voice'" value="announcement">Anúncios</option>
      </select>
    </div>
    <label class="grid gap-1">Nome
      <input [(ngModel)]="name" name="channelName" required maxlength="60"
        class="rounded-md border border-ch-border bg-ch-bg-darker p-2" />
    </label>
    <label class="grid gap-1">Assunto
      <textarea [(ngModel)]="topic" name="topic" rows="2" maxlength="200"
        class="rounded-md border border-ch-border bg-ch-bg-darker p-2"></textarea>
    </label>
    <label class="grid gap-1">Categoria
      <input [(ngModel)]="category" name="category" maxlength="60"
        class="rounded-md border border-ch-border bg-ch-bg-darker p-2" />
    </label>

    <div class="flex justify-end gap-2">
      <button type="button" (click)="close()" [disabled]="saving()"
        class="rounded-md px-4 py-2 font-semibold text-ch-text-muted hover:text-ch-text-primary">Cancelar</button>
      <button type="submit" [disabled]="!name.trim() || saving()"
        class="rounded-md bg-ch-brand px-5 py-2 font-semibold text-white hover:brightness-110 disabled:opacity-40">
        {{ editing ? 'Salvar' : 'Criar' }}
      </button>
    </div>
  </form>
</div>
