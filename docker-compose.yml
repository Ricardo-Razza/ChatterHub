services:
  chatterhub-api:
    build:
      context: "./ChatterHub - API"
      dockerfile: Dockerfile
    container_name: chatterhub-api
    restart: always
    env_file:
      - .env
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - DB_HOST=${DB_HOST:-host.docker.internal}
    ports:
      - "8000:8080"

  chatterhub-front:
    build:
      context: "./ChatterHub - Front"
      dockerfile: Dockerfile
    container_name: chatterhub-front
    restart: always
    depends_on:
      - chatterhub-api
    ports:
      - "3001:80"

  # Opcional: Banco MySQL via container (caso não queira usar o MySQL do aaPanel)
  chatterhub-mysql:
    image: mysql:8.0
    container_name: chatterhub-mysql
    profiles:
      - with-mysql
    restart: always
    environment:
      MYSQL_DATABASE: chatterhubdb
      MYSQL_ROOT_PASSWORD: root_password_segura
      MYSQL_USER: chatterhub_user
      MYSQL_PASSWORD: chatterhub_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
