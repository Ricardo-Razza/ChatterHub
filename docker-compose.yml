services:
  chatterhub-api:
    build:
      context: "./ChatterHub - API"
      dockerfile: Dockerfile
    container_name: chatterhub-api
    restart: always
    network_mode: "host"
    env_file:
      - .env
    environment:
      - PORT=8000
      - DB_HOST=127.0.0.1
      - DB_PORT=3306

  chatterhub-front:
    build:
      context: "./ChatterHub - Front"
      dockerfile: Dockerfile
    container_name: chatterhub-front
    restart: always
    network_mode: "host"
    depends_on:
      - chatterhub-api

  # Opcional: Banco MySQL via container (caso não queira usar o MySQL do aaPanel)
  chatterhub-mysql:
    image: mysql:8.0
    container_name: chatterhub-mysql
    profiles:
      - with-mysql
    restart: always
    environment:
      MYSQL_DATABASE: chatterhubdb
      MYSQL_ROOT_PASSWORD: root_password_segura
      MYSQL_USER: chatterhub_user
      MYSQL_PASSWORD: chatterhub_password
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

volumes:
  mysql_data:
